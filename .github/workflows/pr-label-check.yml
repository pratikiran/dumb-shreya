name: PR Label Check

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]

jobs:
  validate-labels:
    name: Validate Version Labels
    runs-on: ubuntu-latest
    steps:
      - name: Check for version labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name.toLowerCase());
            const versionLabels = ['major', 'minor', 'patch'];
            const foundLabels = labels.filter(label => versionLabels.includes(label));
            
            // Check if no version label exists
            if (foundLabels.length === 0) {
              core.setFailed(
                `❌ PR must have one of the following labels: ${versionLabels.join(', ')}\n\n` +
                `Please add a version label to indicate the type of release:\n` +
                `  • major - Breaking changes (v1.0.0 → v2.0.0)\n` +
                `  • minor - New features, backward compatible (v1.0.0 → v1.1.0)\n` +
                `  • patch - Bug fixes, backward compatible (v1.0.0 → v1.0.1)`
              );
              return;
            }
            
            // Check for conflicting labels
            if (foundLabels.length > 1) {
              core.setFailed(
                `❌ PR has multiple version labels: ${foundLabels.join(', ')}\n\n` +
                `Please use only one version label.`
              );
              return;
            }
            
            console.log(`✅ Version label found: ${foundLabels[0]}`);